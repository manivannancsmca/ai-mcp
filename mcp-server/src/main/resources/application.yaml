server:
  port: 8082

spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        name: product-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        instructions: "This server exposes product catalog tools. Use them to query product information."
        streamable-http:
          mcp-endpoint: /mcp

# Product Service base URL
product:
  service:
    base-url: http://localhost:8081

order:
  service:
    base-url: http://localhost:8083

logging:
  level:
    com.example.mcpserver: INFO
    org.springframework.ai.mcp: DEBUG